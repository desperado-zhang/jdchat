<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JDChat Capture</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        width: 360px;
        margin: 0;
        padding: 16px;
        color: #1f2937;
        background: #f8fafc;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 18px;
        font-weight: 650;
      }

      .panel {
        border: 1px solid #d8dee8;
        border-radius: 8px;
        background: #ffffff;
        padding: 12px;
      }

      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 34px;
        font-size: 13px;
      }

      .row + .row {
        border-top: 1px solid #eef2f7;
      }

      label {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 8px;
        margin: 6px 0 12px;
      }

      input[type="number"] {
        width: 80px;
        box-sizing: border-box;
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 6px 8px;
      }

      input[type="checkbox"] {
        width: 16px;
        height: 16px;
      }

      button {
        border: 1px solid #cbd5e1;
        border-radius: 6px;
        padding: 7px 10px;
        background: #ffffff;
        color: #1f2937;
        cursor: pointer;
        font-size: 13px;
      }

      button.primary {
        border-color: #2563eb;
        background: #2563eb;
        color: #ffffff;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .section {
        margin-top: 12px;
        border-top: 1px solid #eef2f7;
        padding-top: 10px;
      }

      .section-title {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 650;
      }

      .actions {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }

      .collector-status {
        margin-top: 10px;
        border-radius: 6px;
        background: #f1f5f9;
        padding: 8px;
        color: #334155;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-line;
      }

      .hint {
        margin: 12px 0 0;
        color: #64748b;
        font-size: 12px;
        line-height: 1.45;
      }

      .status {
        min-height: 18px;
        margin-top: 10px;
        color: #047857;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>JDChat Capture</h1>
    <div class="panel">
      <label for="gatewayUrl">本机网关</label>
      <input id="gatewayUrl" type="text" autocomplete="off" spellcheck="false">

      <div class="row">
        <label><input id="enabled" type="checkbox"> 总开关</label>
      </div>
      <div class="row">
        <label><input id="captureReceptionChatLog" type="checkbox"> 京麦聊天记录采集</label>
      </div>
      <div class="row">
        <label><input id="captureLegacyRealtime" type="checkbox"> 旧咚咚实时采集</label>
      </div>
      <div class="row">
        <label><input id="captureDom" type="checkbox"> DOM 监听</label>
      </div>
      <div class="row">
        <label><input id="captureSession" type="checkbox"> session 快照</label>
      </div>
      <div class="row">
        <label><input id="captureNetwork" type="checkbox"> Network 被动监听</label>
      </div>
      <div class="row">
        <label><input id="captureFetch" type="checkbox"> fetch</label>
      </div>
      <div class="row">
        <label><input id="captureXhr" type="checkbox"> XHR</label>
      </div>
      <div class="row">
        <label><input id="captureWebSocket" type="checkbox"> WebSocket</label>
      </div>
      <div class="row">
        <label><input id="autoScrollHistory" type="checkbox"> 历史自动上翻</label>
      </div>
      <div class="section">
        <p class="section-title">京麦受控采集</p>
        <div class="row">
          <label><input id="receptionDailyFullCapture" type="checkbox"> 每日全量补抓</label>
        </div>
        <div class="row">
          <label for="receptionMaxPages">全量页数上限</label>
          <input id="receptionMaxPages" type="number" min="1" max="500" step="1">
        </div>
        <div class="row">
          <label for="receptionMaxConversations">会话上限</label>
          <input id="receptionMaxConversations" type="number" min="1" max="10000" step="1">
        </div>
        <div class="row">
          <label for="receptionMaxRuntimeMinutes">最长分钟</label>
          <input id="receptionMaxRuntimeMinutes" type="number" min="1" max="240" step="1">
        </div>
        <div class="row">
          <label><input id="receptionAutoRefresh" type="checkbox"> 自动增量巡检</label>
        </div>
        <div class="row">
          <label for="receptionRefreshIntervalMinutes">刷新间隔分钟</label>
          <input id="receptionRefreshIntervalMinutes" type="number" min="1" max="240" step="1">
        </div>
        <div class="row">
          <label for="receptionIncrementalPages">增量巡检页数</label>
          <input id="receptionIncrementalPages" type="number" min="1" max="100" step="1">
        </div>
        <div class="row">
          <label for="receptionStableTailRounds">追平确认轮数</label>
          <input id="receptionStableTailRounds" type="number" min="1" max="10" step="1">
        </div>
        <div class="actions">
          <button id="startReceptionCollector" class="primary" type="button">开始采集</button>
          <button id="stopReceptionCollector" type="button">停止</button>
        </div>
        <div id="collectorStatus" class="collector-status" aria-live="polite">状态：未连接当前页面</div>
      </div>
      <p class="hint">京麦聊天记录采集读取“查看”弹窗对应的明细接口，并通过独立接口与独立表入库；旧咚咚实时采集默认关闭。</p>
      <div id="status" class="status" aria-live="polite"></div>
    </div>
    <script src="options.js"></script>
  </body>
</html>
